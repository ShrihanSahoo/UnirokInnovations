{% extends "base.html" %}

{% block content %}
<section class="py-20 fade-in text-center max-w-sm mx-auto px-6">
    <div class="bg-unirokDark border border-white/10 p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-unirokGold mb-6">Admin Login</h1>
        
        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1 text-left">Password</label>
                <input type="password" name="password" required class="w-full bg-black border border-white/20 rounded px-4 py-3 text-white focus:outline-none focus:border-unirokGold transition-colors" placeholder="Enter simple admin pass...">
            </div>
            <button type="submit" class="w-full bg-unirokGold text-black font-bold py-3 rounded hover:bg-yellow-400 transition-colors">
                Secure Login
            </button>
        </form>
    </div>
</section>
{% endblock %}
